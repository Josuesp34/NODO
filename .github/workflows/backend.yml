name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend/fit-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/fit-parser/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: alembic -c alembic.ini upgrade head --sql > /dev/null
        env:
          DATABASE_URL: postgresql+asyncpg://nodo:nodo@localhost:5432/nodo
