name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/api/requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_DB: nodo_ci
          POSTGRES_USER: nodo_ci
          POSTGRES_PASSWORD: nodo_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodo_ci -d nodo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend/api
    env:
      DATABASE_URL: postgresql+asyncpg://nodo_ci:nodo_ci_only@127.0.0.1:5432/nodo_ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: alembic -c alembic.ini upgrade head
      - run: alembic -c alembic.ini check
      - run: alembic -c alembic.ini downgrade base
      - run: alembic -c alembic.ini upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build runtime image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: backend/api
          load: true
          push: false
          tags: nodo-api:ci
      - name: Migration job assets are present in runtime image
        run: docker run --rm --entrypoint sh nodo-api:ci -c 'test -f alembic.ini && test -d migrations && alembic --help >/dev/null'
