name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribir DEPLOY-STAGING después de revisar el plan Terraform y el costo"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY-STAGING'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate release prerequisites
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          PWA_SERVICE: ${{ vars.PWA_SERVICE }}
          MIGRATION_JOB: ${{ vars.MIGRATION_JOB }}
        run: bash ops/validate-release.sh source
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: backend/api
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/api:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - id: pwa
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: frontend
          file: frontend/apps/nodo-web/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/pwa:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan API image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/api@${{ steps.api.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Scan PWA image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/pwa@${{ steps.pwa.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Migrate before shifting traffic
        env:
          API_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/api@${{ steps.api.outputs.digest }}
        run: |
          gcloud run jobs update "${{ vars.MIGRATION_JOB }}" --image "$API_IMAGE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet
          gcloud run jobs execute "${{ vars.MIGRATION_JOB }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --wait
      - name: Deploy services by digest
        env:
          API_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/api@${{ steps.api.outputs.digest }}
          PWA_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/pwa@${{ steps.pwa.outputs.digest }}
        run: |
          gcloud run services update "${{ vars.API_SERVICE }}" --image "$API_IMAGE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet
          gcloud run services update "${{ vars.PWA_SERVICE }}" --image "$PWA_IMAGE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet
          if [[ "${{ vars.WORKER_ENABLED }}" == "true" ]]; then
            gcloud beta run worker-pools update "${{ vars.WORKER_POOL }}" --image "$API_IMAGE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet
          fi
      - name: Smoke test deployed revision
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          PWA_SERVICE: ${{ vars.PWA_SERVICE }}
        run: bash ops/smoke-production.sh
      - name: Release evidence
        run: |
          printf '%s\n' "commit=${GITHUB_SHA}" "api_digest=${{ steps.api.outputs.digest }}" "pwa_digest=${{ steps.pwa.outputs.digest }}" > release-evidence.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-release-evidence-${{ github.sha }}
          path: release-evidence.txt
          retention-days: 30
