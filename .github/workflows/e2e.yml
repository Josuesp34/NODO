name: Product E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrated-product:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated synthetic product, migrate and seed through API
        run: python3 ops/demo.py up
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Browser checks against actual API, PostgreSQL and worker
        run: npm run test:e2e
        working-directory: frontend
      - name: Stop demo while preserving its database
        if: always()
        run: python3 ops/demo.py stop
