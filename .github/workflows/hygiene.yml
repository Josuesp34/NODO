name: Hygiene checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Las mismas reglas que corren en cada commit local.
      - uses: pre-commit/action@v3.0.1
