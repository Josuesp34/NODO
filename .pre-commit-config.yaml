# Higiene mínima antes de cada commit.
#
# Instalar una vez por clon, desde la raíz del repositorio:
#   python -m pip install -r backend/api/requirements-dev.txt
#   pre-commit install
#
# Revisar todo el repositorio sin commitear:
#   pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Misma versión que requirements-dev.txt y que el CI.
      - id: ruff-check
        args: [--fix]
        files: ^backend/api/.*\.py$

  - repo: local
    hooks:
      - id: sin-secretos-ni-datos
        name: Nada de .env, archivos FIT ni artefactos en Git
        entry: >-
          Regla 9 del plan de ejecucion: .env, tokens, datos de atletas, archivos FIT,
          node_modules, capturas y logs se quedan fuera del repositorio.
        language: fail
        files: '(^|/)\.env(\.|$)|\.[fF][iI][tT]$|(^|/)node_modules/|(^|/)__pycache__/|(^|/)\.next/|\.log$'
        exclude: '(^|/)\.env\.example$'
