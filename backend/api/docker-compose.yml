# Entorno exclusivamente local. Copiar .env.example a .env antes de arrancar.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Configurar DOCKER_DATABASE_URL en .env}
      ALLOW_COACH_REGISTRATION: ${ALLOW_COACH_REGISTRATION:-false}
      ALLOW_SUPERUSER_BOOTSTRAP: ${ALLOW_SUPERUSER_BOOTSTRAP:-false}
      DEV_SUPERUSER_BOOTSTRAP_TOKEN: ${DEV_SUPERUSER_BOOTSTRAP_TOKEN:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  timescaledb:
    image: timescale/timescaledb-ha@sha256:a8e3322e1cf936828698cb4de2a9c4b59acae1b123909f023bb15f42270af95d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configurar POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configurar POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      timescaledb-init:
        condition: service_completed_successfully

  # La imagen HA usa el UID 1000. Docker Desktop crea los volúmenes con otro
  # propietario, por lo que se prepara una sola vez antes de iniciar Postgres.
  timescaledb-init:
    image: alpine:3.21
    volumes:
      - timescaledb_data:/data
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R 700 /data"]
    restart: "no"

volumes:
  timescaledb_data:
